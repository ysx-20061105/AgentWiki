<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面未找到 - AgentWiki</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f6f8fa;
      color: #1f2937;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 6rem;
      font-weight: 800;
      color: #2563eb;
      margin: 0;
      line-height: 1;
    }
    p {
      font-size: 1.2rem;
      color: #6b7280;
      margin: 16px 0 32px;
    }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: #2563eb;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>页面未找到，请检查链接是否正确</p>
    <a href="/">返回首页</a>
  </div>
  <script>
    // GitHub Pages SPA 支持：将路径转为 hash 路由
    (function() {
      const path = window.location.pathname.replace(/^\/AgentWiki/, '');
      if (path && path !== '/' && !path.includes('.')) {
        window.location.replace('/#/' + path);
      }
    })();
  </script>
</body>
</html>
