name: Update Index & RSS

on:
  push:
    branches: [main]
    paths:
      - 'articles/*.md'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate index.json and feed.xml
        run: node .github/scripts/generate-index.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json feed.xml
          git diff --cached --quiet || git commit -m "chore: update index.json and feed.xml [skip ci]"
          git push
